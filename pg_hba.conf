1. Общая методология настройки памяти PostgreSQL
1.1 Модель потребления памяти
PostgreSQL использует два типа памяти:

Тип	Область	Расход
Shared Memory	Разделяемая между всеми процессами	shared_buffers + wal_buffers
Local Memory	На каждое соединение или операцию	work_mem × параллельные операции + maintenance_work_mem
1.2 Формула максимального потребления
yaml
MaxRAM_usage = 
    shared_buffers 
    + (max_connections × (work_mem + temp_buffers + 5MB_overhead))
    + maintenance_work_mem 
    + wal_buffers
    + OS_cache (≈25% от RAM)
Критическое правило: Расчётное значение должно быть ≤ 75% от общей RAM сервера/контейнера.

2. Детальный разбор каждого параметра
2.1 shared_buffers — кэш данных в общей памяти
Назначение: Хранение кэшированных страниц данных (таблиц, индексов, системных каталогов) в оперативной памяти.

Формула расчёта:
shared_buffers = RAM_total × 0.25

Доступная RAM	shared_buffers (min)	shared_buffers (max)	Рекомендация
2 GB	256 MB	512 MB	512 MB
4 GB	512 MB	1 GB	1 GB
8 GB	1 GB	2 GB	2 GB
16 GB	2 GB	4 GB	4 GB
32 GB	4 GB	8 GB	8 GB
64 GB	8 GB	16 GB	12 GB
128 GB+	16 GB	32 GB	20 GB
Почему не больше 25%:

Дублирование с page cache ОС (данные и так в кэше ядра)

Каждая контрольная точка (checkpoint) дорожает пропорционально shared_buffers

Увеличение выше 8-16GB даёт уменьшающуюся отдачу

Конфигурация:

ini
# postgresql.conf
shared_buffers = 2GB          # для 8GB RAM
# Или относительное значение (PostgreSQL 9.4+)
shared_buffers = 25%
Проверка через системные метрики (без таблиц):

bash
# Просмотр использования общей памяти PostgreSQL
ipcs -m | grep postgres

# Мониторинг page cache ОС
cat /proc/meminfo | grep -E "^(Cached|Dirty|Writeback)"
2.2 work_mem — память на операцию сортировки/хеша
Назначение: Максимальный объём памяти для:

Сортировок (ORDER BY, DISTINCT, GROUP BY)

Хеш-таблиц (JOIN)

Битмап-сканирований (bitmap heap scan)

Важнейшее правило: work_mem потребляется каждой операцией сортировки/хеша в запросе, а не на запрос целиком. Один сложный запрос может содержать 5-10 таких операций.

Формула расчёта:
work_mem = (RAM_total × 0.25) / max_connections

RAM	max_connections	work_mem
4 GB	50	20 MB
4 GB	100	10 MB
8 GB	100	20 MB
8 GB	200	10 MB
16 GB	100	40 MB
16 GB	200	20 MB
32 GB	200	40 MB
64 GB	300	50 MB
Типовые значения по нагрузке:

Сценарий	work_mem	Обоснование
Высококонкурентный OLTP (200+ соединений)	4-8 MB	Запросы маленькие, сортировки кратковременны
Стандартный OLTP (50-100 соединений)	16-32 MB	Баланс между памятью и скоростью
Гибридный (OLTP + отчёты)	32-64 MB	Отчёты требуют больше памяти
Аналитика / OLAP (<20 соединений)	128-512 MB	Сложные сортировки, но мало сессий
Data Warehouse (единичные запросы)	1-4 GB	Максимальная производительность
Конфигурация:

ini
work_mem = 20MB   # базовое значение

# Временное повышение для конкретной сессии (psql, приложение)
SET work_mem = '256MB';
Мониторинг переполнения на диск (без таблиц):

sql
-- Проверка использования временных файлов по базам данных
SELECT 
    datname,
    temp_files,
    pg_size_pretty(temp_bytes) AS temp_size
FROM pg_stat_database 
WHERE temp_files > 0
ORDER BY temp_bytes DESC;
Системный мониторинг (через ОС):

bash
# Отслеживание создания временных файлов PostgreSQL
watch -n 1 'ls -la /var/lib/postgresql/data/base/pgsql_tmp/ 2>/dev/null | wc -l'

# Общий объём временных файлов
du -sh /var/lib/postgresql/data/base/pgsql_tmp/
2.3 effective_cache_size — оценка кэша ОС
Назначение: Подсказка планировщику запросов о том, какой объём данных может быть закэширован на уровне операционной системы (page cache + shared_buffers). Не выделяет память — только влияет на выбор плана.

Формула расчёта:
effective_cache_size = RAM_total × (0.5 ... 0.75)

RAM	effective_cache_size (min)	effective_cache_size (max)
4 GB	2 GB	3 GB
8 GB	4 GB	6 GB
16 GB	8 GB	12 GB
32 GB	16 GB	24 GB
64 GB	32 GB	48 GB
128 GB	64 GB	96 GB
Как влияет на планировщик:

Значение	Поведение планировщика	Когда использовать
Занижено	Отдаёт предпочтение последовательным сканированиям (Seq Scan)	HDD-диски, холодные данные
Оптимально	Сбалансированное использование индексов	SSD-диски, горячие данные
Завышено	Чаще использует индексные сканирования (Index Scan)	RAM много, данные в кэше
Конфигурация:

ini
effective_cache_size = 6GB   # для 8GB RAM
Проверка через системные метрики:

bash
# Текущий размер page cache
cat /proc/meminfo | grep -E "^Cached"

# Активность чтения с диска (должна быть низкой при большом effective_cache_size)
iostat -x 1 | grep -E "(^Device|sd|nvme)"
2.4 maintenance_work_mem — память для обслуживания
Назначение: Максимальная память для операций обслуживания:

VACUUM (ручной и автовакуум)

CREATE INDEX / REINDEX

ADD FOREIGN KEY

CLUSTER

Особенность: Потребляется одним процессом (autovacuum worker), поэтому может быть значительно выше work_mem.

Рекомендации:

Сценарий	maintenance_work_mem	autovacuum_work_mem
Лёгкий OLTP (редкие UPDATE/DELETE)	256 MB	128 MB
Средний OLTP (частые изменения)	512 MB	256 MB
Тяжёлый OLTP (активные обновления)	1 GB	512 MB
OLAP / DWH (редкое обслуживание)	2-4 GB	1 GB
Миграции с большими индексами	4-8 GB	-
Конфигурация:

ini
maintenance_work_mem = 512MB

# Отдельно для автовакуума (PostgreSQL 13+)
autovacuum_work_mem = 256MB   # если не задан, используется maintenance_work_mem
Мониторинг эффективности (без таблиц):

sql
-- Проверка использования памяти процессами VACUUM
SELECT 
    pid,
    usename,
    application_name,
    state,
    wait_event_type,
    wait_event
FROM pg_stat_activity
WHERE query LIKE 'autovacuum%' OR query LIKE 'VACUUM%';
bash
# Мониторинг RSS памяти процессов autovacuum
ps aux | grep autovacuum | awk '{print $2, $6, $11}'
3. Дополнительные параметры памяти
3.1 wal_buffers — буфер журнала предзаписи
Назначение: Буферизация WAL-записей перед сбросом на диск.

Формула:
wal_buffers = shared_buffers / 32, но не более 16MB

shared_buffers	wal_buffers (auto)	Ручная настройка
256 MB	8 MB	4 MB
512 MB	16 MB	8 MB
1 GB	32 MB (обрезается до 16MB)	16 MB
2 GB+	64 MB+ (обрезается)	16 MB
Конфигурация:

ini
wal_buffers = 16MB      # максимум для большинства случаев
# или оставить авто (-1)
wal_buffers = -1        # PostgreSQL сам вычисляет как 1/32 от shared_buffers
3.2 temp_buffers — буфер для временных таблиц
Назначение: Память для временных таблиц в рамках сессии.

Конфигурация:

ini
temp_buffers = 16MB     # на сессию, при создании временных таблиц
3.3 max_connections и оверхед на соединение
Каждое подключение потребляет:

2-5 MB для стека и контекста

Дополнительная память под work_mem при активных операциях

Расчёт оверхеда:

yaml
Memory_overhead = max_connections × 5MB
Рекомендации:

Тип системы	max_connections	Примечание
Без пула соединений	50-100	Высокий оверхед
С PgBouncer (рекомендуется)	50-100	Достаточно для всех приложений
OLAP / отчёты	10-30	Сложные запросы требуют больше памяти на операцию
Тестовое окружение	20-50	Минимальное потребление
ini
max_connections = 100
superuser_reserved_connections = 3   # для обслуживания
4. Полный пример postgresql.conf (только параметры памяти и мониторинга)
ini
# ============================================================
# ОСНОВНЫЕ ПАРАМЕТРЫ ПАМЯТИ
# ============================================================

# 25% от 8GB RAM = 2GB
shared_buffers = 2GB

# RAM / max_connections / 4 = 8192 / 100 / 4 = 20MB
work_mem = 20MB

# 75% от 8GB = 6GB (подсказка планировщику)
effective_cache_size = 6GB

# Обслуживание (VACUUM, CREATE INDEX)
maintenance_work_mem = 512MB

# Автовакуум (PostgreSQL 13+)
autovacuum_work_mem = 256MB

# Журнал предзаписи (WAL)
wal_buffers = 16MB

# Временные таблицы
temp_buffers = 16MB

# ============================================================
# СОЕДИНЕНИЯ И ПРОЦЕССЫ
# ============================================================

max_connections = 100
superuser_reserved_connections = 3

# Память на соединение (явный лимит)
session_preload_libraries = ''   # минимизация оверхеда

# ============================================================
# ЛОГИРОВАНИЕ ДИАГНОСТИКИ ПАМЯТИ
# ============================================================

# Логировать операции, использующие диск вместо памяти
log_temp_files = 100KB

# Логировать операции VACUUM/ANALYZE
log_autovacuum_min_duration = 1000

# Логировать медленные запросы (признак нехватки work_mem)
log_min_duration_statement = 500

# Логировать использование памяти
log_lock_waits = on
log_checkpoints = on

# ============================================================
# РАСШИРЕННЫЙ МОНИТОРИНГ (требует перезапуска)
# ============================================================

shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = all
pg_stat_statements.max = 10000

# Автовакуум
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 60s
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_scale_factor = 0.05
autovacuum_vacuum_cost_delay = 2ms   # для SSD
5. Процедура настройки для контейнера Docker
5.1 Скрипт автоматического расчёта параметров
Создайте скрипт generate_postgresql_conf.sh:

bash
#!/bin/bash
# Автоматический расчёт параметров памяти PostgreSQL

# Определяем доступную RAM в контейнере
RAM_BYTES=$(cat /sys/fs/cgroup/memory/memory.limit_in_bytes 2>/dev/null || free -b | awk '/^Mem:/{print $2}')
RAM_GB=$(echo "scale=0; $RAM_BYTES / 1073741824" | bc)

if [ $RAM_GB -lt 2 ]; then
    echo "WARNING: RAM меньше 2GB, параметры будут минимальными"
    SHARED_BUFFERS="256MB"
    EFFECTIVE_CACHE="1GB"
    WORK_MEM="4MB"
    MAINTENANCE_WORK_MEM="64MB"
elif [ $RAM_GB -lt 4 ]; then
    SHARED_BUFFERS="512MB"
    EFFECTIVE_CACHE="2GB"
    WORK_MEM="8MB"
    MAINTENANCE_WORK_MEM="128MB"
elif [ $RAM_GB -lt 8 ]; then
    SHARED_BUFFERS="1GB"
    EFFECTIVE_CACHE="4GB"
    WORK_MEM="16MB"
    MAINTENANCE_WORK_MEM="256MB"
elif [ $RAM_GB -lt 16 ]; then
    SHARED_BUFFERS="2GB"
    EFFECTIVE_CACHE="6GB"
    WORK_MEM="20MB"
    MAINTENANCE_WORK_MEM="512MB"
elif [ $RAM_GB -lt 32 ]; then
    SHARED_BUFFERS="4GB"
    EFFECTIVE_CACHE="12GB"
    WORK_MEM="32MB"
    MAINTENANCE_WORK_MEM="1GB"
else
    SHARED_BUFFERS="8GB"
    EFFECTIVE_CACHE="24GB"
    WORK_MEM="64MB"
    MAINTENANCE_WORK_MEM="2GB"
fi

# Генерируем конфигурационный файл
cat > /etc/postgresql/postgresql.conf <<EOF
shared_buffers = $SHARED_BUFFERS
effective_cache_size = $EFFECTIVE_CACHE
work_mem = $WORK_MEM
maintenance_work_mem = $MAINTENANCE_WORK_MEM
autovacuum_work_mem = ${MAINTENANCE_WORK_MEM%??}  # половина от maintenance_work_mem
max_connections = 100
temp_buffers = 16MB
wal_buffers = 16MB
log_temp_files = 100KB
log_min_duration_statement = 500
log_autovacuum_min_duration = 1000
shared_preload_libraries = 'pg_stat_statements'
EOF

echo "Конфигурация сгенерирована для RAM: ${RAM_GB}GB"
5.2 Dockerfile с автоматической настройкой
dockerfile
FROM postgres:16-alpine

# Копируем скрипт автоматической конфигурации
COPY generate_postgresql_conf.sh /docker-entrypoint-initdb.d/00-generate-config.sh
COPY postgresql.conf.template /etc/postgresql/postgresql.conf.template

# Делаем скрипт исполняемым
RUN chmod +x /docker-entrypoint-initdb.d/00-generate-config.sh

# Устанавливаем стандартный config_file
CMD ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
6. Мониторинг и валидация настроек
6.1 Проверка применённых значений
sql
SELECT 
    name, 
    setting, 
    unit, 
    context, 
    short_desc
FROM pg_settings 
WHERE name IN (
    'shared_buffers', 
    'work_mem', 
    'effective_cache_size', 
    'maintenance_work_mem',
    'autovacuum_work_mem',
    'wal_buffers',
    'temp_buffers',
    'max_connections'
)
ORDER BY name;
6.2 Мониторинг использования памяти
bash
# Общее использование памяти PostgreSQL в контейнере
docker stats --no-stream postgres_container

# Детально по процессам внутри контейнера
docker exec postgres_container ps aux | grep postgres | awk '{sum+=$6} END {print "Total RSS: " sum/1024 " MB"}'

# Размер общей памяти (shared_buffers)
docker exec postgres_container sh -c "cat /proc/sys/kernel/shmmax && ipcs -m | grep postgres"
6.3 Проверка отсутствия свопинга
bash
# Уровень использования swap
docker exec postgres_container cat /proc/meminfo | grep -E "^(SwapTotal|SwapFree)"
docker exec postgres_container vmstat 1 5 | awk '{print $7}'  # si (swap in)
7. Чек-лист Database Configuration Specialist
Параметры памяти (обязательно к проверке):

shared_buffers = 25% от RAM контейнера (контроль через pg_settings)

effective_cache_size = 50-75% от RAM

work_mem = (RAM / max_connections) / 4 (с округлением вниз)

maintenance_work_mem ≥ 256MB (512MB-1GB рекомендовано)

autovacuum_work_mem задан отдельно (PostgreSQL 13+)

wal_buffers = 16MB или -1 (auto)

temp_buffers = 16MB (базовое значение)

Диагностика (проверка работы):

Нет сообщений о временных файлах в логах (log_temp_files)

Cache hit ratio > 98% (через pg_stat_database)

Нет активного swap usage (si/so в vmstat = 0)

Медленные запросы (>500ms) отсутствуют или редки

Автовакуум успевает обрабатывать нагрузку

Документация:

Зафиксированы расчётные формулы

Сохранена исходная конфигурация (бэкап)

Измерен baseline производительности до изменений

Настроен мониторинг (Prometheus + postgres_exporter)
