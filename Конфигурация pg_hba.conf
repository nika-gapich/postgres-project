1. Назначение файла pg_hba.conf
Файл pg_hba.conf (Host-Based Authentication) — основной механизм контроля подключений к серверу PostgreSQL. Он определяет:

Какие хосты / подсети могут подключаться.

Каким пользователям и к каким БД разрешён вход.

Какой метод аутентификации применяется (пароль, сертификат, GSSAPI и др.).

Правила читаются сверху вниз, применяется первое подходящее правило. В конце файла обычно добавляется правило-ловушка reject для всех остальных.

2. Формат записи правил
bash
# Тип  База    Пользователь  Адрес(ы)        Метод        [опции]
local   dbname  user          [unix-socket]   trust/md5...
host    dbname  user          IP/маска        method
hostssl ...                                    (только SSL)
hostnossl ...                                  (только не-SSL)
local — соединения через Unix-сокет (обычно надёжнее).

host — TCP/IP (IPv4 или IPv6).

hostssl — только по SSL/TLS.

hostnossl — только без шифрования (не рекомендуется).

Специальные значения:

all — все БД / все пользователи.

sameuser — БД совпадает с именем пользователя.

samerole — роль пользователя совпадает с именем БД.

0.0.0.0/0 или ::/0 — все IPv4/IPv6 адреса.

3. Методы аутентификации (md5, scram-sha-256 и др.)
3.1. md5
Что делает: передача пароля, хэшированного MD5 + соль.

Устаревает: MD5 считается криптографически слабым (атаки перебора, коллизии).

Поддержка: совместим со старыми клиентами.

3.2. scram-sha-256 (рекомендован)
Что делает: SCRAM (Salted Challenge Response) с SHA‑256 — стойкое хранение паролей (соль, итерации) и безопасная передача (без раскрытия хэша).

Преимущества: устойчиво к атакам перехвата/перебора, современный стандарт.

Требование: пароль пользователя должен быть сохранён в pg_authid в формате SCRAM (начиная с PostgreSQL 10+).

Переключение:

sql
ALTER USER username PASSWORD 'новый_пароль';  -- пароль будет в SCRAM
-- или глобально в postgresql.conf:
password_encryption = 'scram-sha-256'
3.3. Другие методы
trust — абсолютно небезопасен (без пароля). Только для локальных отладок.

reject — запрет соединения.

peer / ident — по системному пользователю (только local).

cert — аутентификация по SSL-сертификату.

ldap, radius, pam — внешние сервисы.

4. Разграничение доступа по IP/подсетям
Примеры правил:

bash
# Разрешить локальному администратору без пароля (только из Unix-сокета)
local   all       postgres                      trust

# Разрешить пользователю app_user подключаться к БД app_db из подсети 192.168.1.0/24 методом scram-sha-256
host    app_db    app_user       192.168.1.0/24  scram-sha-256

# Разрешить группе сотрудников из офиса (IPv4)
host    all       +staff         10.10.0.0/16    scram-sha-256

# Разрешить резервную копию только по SSL с конкретного хоста
hostssl all       backup_user    192.168.100.5/32 scram-sha-256

# Запретить любые попытки из "плохой" сети (раннее правило)
host    all       all            172.18.0.0/16   reject

# Разрешить веб-серверам из DMZ только чтение (подключение к БД reporting)
host    reporting readonly_user  10.200.10.0/24  scram-sha-256

# В конце – запрет всего остального, что не подошло выше
host    all       all            0.0.0.0/0       reject
host    all       all            ::/0            reject

5. Защита от несанкционированного доступа
5.1. Принципы составления правил
Минимальные привилегии – разрешать только dbname+user+ip, которые реально нужны.

Никогда trust для TCP/IP (только для local/socket в изолированной среде).

Используйте hostssl везде, где это возможно – требует шифрования трафика.

Запрещайте доступ суперпользователя (postgres) по сети:

bash
host    all    postgres    0.0.0.0/0    reject
Явное правило reject в конце – отсекает все неразрешённые подключения.

5.2. Дополнительные меры
Ограничение по времени (через pg_hba.conf нельзя, но можно через pg_ident.conf + PAM, либо на уровне ОС: iptables/firewall).

Используйте параметры postgresql.conf:

listen_addresses = '127.0.0.1,10.0.0.1' – только нужные интерфейсы.

port = 5432 (или изменить, чтобы усложнить автоматический сканер).

Мониторинг логов: log_connections = on, log_disconnections = on – видно все попытки с IP.

Сетевые экраны (например, iptables/nftables) как второй рубеж:

bash
iptables -A INPUT -p tcp --dport 5432 -s 10.0.0.0/8 -j ACCEPT
iptables -A INPUT -p tcp --dport 5432 -j DROP
5.3. Проверка конфигурации
После изменения pg_hba.conf:

bash
# Проверка синтаксиса
pg_ctl -D /путь/к/данным check

# Перечитать конфиг (без перезапуска)
pg_ctl reload

# Или через SQL (для суперпользователя)
SELECT pg_reload_conf();
Проверить, какое правило сработает для конкретного клиента, поможет представление pg_hba_file_rules:

sql
SELECT * FROM pg_hba_file_rules;
5.4. Пример безопасной конфигурации (минимум)
bash
# local, только необходимые пользователи
local   all         postgres                trust        # только для админских задач, лучше заменить на peer
local   all         all                     scram-sha-256

# через сеть – только шифрование и SCRAM
hostssl all         all         127.0.0.1/32        scram-sha-256   # локальное подключение
hostssl app_db      app_user    10.2.0.0/24         scram-sha-256
hostssl monitoring  zabbix      10.2.10.5/32        scram-sha-256

# всё остальное – запрещено
hostnossl all       all         0.0.0.0/0           reject
host     all       all          0.0.0.0/0           reject
host     all       all          ::/0                reject
